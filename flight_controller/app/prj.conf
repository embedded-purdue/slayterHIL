# This file contains selected Kconfig options for the application.

CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PWM=y
CONFIG_LIDAR_LITE_V4=y
CONFIG_LOG=y
CONFIG_PRINTK=y
# --- Debug / diagnostics (intentional — see TRANSITION.md §9) ---
CONFIG_THREAD_STACK_INFO=y
# Guard word at each stack end, checked on context switch: a stack overflow
# becomes a named fatal message instead of silent corruption + a wild crash.
CONFIG_STACK_SENTINEL=y
# Real thread names in crash dumps and the analyzer (not "(unknown)").
CONFIG_THREAD_NAME=y
# Print every thread's stack high-water mark + CPU% every 20s. Keep it; for a
# quieter console raise the interval rather than removing it.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=20
# --- end diagnostics ---
CONFIG_NEWLIB_LIBC=y
CONFIG_PWM=y
# CONFIG_MPU6050_TRIGGER=y
CONFIG_MPU6050_TRIGGER_GLOBAL_THREAD=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SENSOR=y
CONFIG_BNO055=y
CONFIG_BNO055_TRIGGER=y
CONFIG_SENSOR_LOG_LEVEL_INF=y
CONFIG_MPU6050=y
CONFIG_NANOPB=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y




